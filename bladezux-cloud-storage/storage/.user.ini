; PHP limits for /storage only (cPanel MultiPHP / PHP-FPM read .user.ini).
; Direct browser-to-Drive uploads are NOT limited by these values; they only
; size the relay fallback chunks and long-running downloads.
post_max_size = 64M
upload_max_filesize = 8M
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
expose_php = Off
session.cookie_httponly = 1
session.use_strict_mode = 1
