[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "origin-core"
version = "0.1.0"
description = "Origin Core: tokenizer, transformer, training, evaluation and inference for Origin AI's own foundation models."
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy"]

[project.scripts]
origin-core = "origin_core.cli:main"

[tool.setuptools.packages.find]
include = ["origin_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
