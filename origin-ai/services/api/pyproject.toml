[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "origin-api"
version = "0.1.0"
description = "Origin AI platform API"
requires-python = ">=3.10"
dependencies = [
  "origin-core",
  "fastapi>=0.110",
  "uvicorn[standard]",
  "sqlalchemy>=2.0",
  "psycopg[binary]",
  "pydantic-settings",
  "argon2-cffi; platform_system != 'Android'",
  "python-multipart",
  "psutil",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
include = ["origin_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
